<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Banca</title>
  <meta name="description" content="Grupos de Gestão cadastram cardápio e preços da banca na Feira de Empreendedorismo.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="topo">
    <h1>Cardápio da sua banca</h1>
    <p class="sub">Para os grupos de Gestão. O que você salvar aqui aparece na hora no <a href="./">guia da feira</a>.</p>
  </header>

  <form class="caixa" id="form" style="margin-top:24px">
    <label for="banca">Sua banca</label>
    <select id="banca" required></select>

    <div id="campos" hidden>
      <h2 style="margin-top:24px">Produtos</h2>
      <div class="rolavel">
        <table class="tabela">
          <thead><tr><th scope="col">Produto</th><th scope="col">Preço (R$)</th><th scope="col">Esgotado</th><th scope="col"><span class="sub">Remover</span></th></tr></thead>
          <tbody id="produtos"></tbody>
        </table>
      </div>
      <button class="botao secundario" type="button" id="mais" style="margin-top:12px">Adicionar produto</button>

      <label for="pagamento">Formas de pagamento</label>
      <input id="pagamento" placeholder="Pix, dinheiro e cartão">

      <label for="instagram">Instagram</label>
      <input id="instagram" placeholder="@suabanca">

      <div style="margin-top:20px"><button class="botao" type="submit">Salvar cardápio</button></div>
    </div>
    <p class="aviso" id="aviso" role="status"></p>
  </form>
</main>

<script type="module">
  import { db, collection, doc, onSnapshot, updateDoc, esc } from './firebase.js';

  const sel = document.getElementById('banca');
  const campos = document.getElementById('campos');
  const corpo = document.getElementById('produtos');
  const aviso = document.getElementById('aviso');
  let bancas = [];

  function linha(p = { nome: '', preco: '', esgotado: false }) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input aria-label="Produto" class="p-nome" value="${esc(p.nome)}" required></td>
      <td><input aria-label="Preço" class="p-preco" inputmode="decimal" value="${p.preco === '' ? '' : String(p.preco).replace('.', ',')}" required style="max-width:110px"></td>
      <td><input aria-label="Esgotado" class="p-esg" type="checkbox" ${p.esgotado ? 'checked' : ''} style="width:24px;min-height:24px"></td>
      <td><button class="botao secundario" type="button" aria-label="Remover produto">x</button></td>`;
    tr.querySelector('button').onclick = () => tr.remove();
    corpo.append(tr);
  }

  onSnapshot(collection(db, 'bancas'), (snap) => {
    bancas = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => a.numero - b.numero);
    const atual = sel.value;
    sel.innerHTML = '<option value="">Escolha</option>' +
      bancas.map((b) => `<option value="${esc(b.id)}">${b.numero}. ${esc(b.nome)}</option>`).join('');
    sel.value = atual;
  });

  sel.onchange = () => {
    const b = bancas.find((x) => x.id === sel.value);
    campos.hidden = !b;
    aviso.textContent = '';
    if (!b) return;
    corpo.innerHTML = '';
    (b.produtos?.length ? b.produtos : [undefined]).forEach((p) => linha(p));
    document.getElementById('pagamento').value = b.pagamento || '';
    document.getElementById('instagram').value = b.instagram || '';
  };

  document.getElementById('mais').onclick = () => linha();

  document.getElementById('form').onsubmit = async (e) => {
    e.preventDefault();
    aviso.className = 'aviso';
    const produtos = [...corpo.querySelectorAll('tr')].map((tr) => ({
      nome: tr.querySelector('.p-nome').value.trim(),
      preco: Number(tr.querySelector('.p-preco').value.replace(',', '.')),
      esgotado: tr.querySelector('.p-esg').checked,
    })).filter((p) => p.nome);
    if (produtos.some((p) => !(p.preco >= 0))) {
      aviso.textContent = 'Confira os preços: use só números, como 6,50.';
      aviso.classList.add('erro');
      return;
    }
    try {
      await updateDoc(doc(db, 'bancas', sel.value), {
        produtos,
        pagamento: document.getElementById('pagamento').value.trim(),
        instagram: document.getElementById('instagram').value.trim(),
      });
      aviso.textContent = 'Cardápio salvo. Já aparece no guia.';
      aviso.classList.add('ok');
    } catch {
      aviso.textContent = 'Não foi possível salvar. Tente de novo.';
      aviso.classList.add('erro');
    }
  };
</script>
</body>
</html>
